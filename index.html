<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Night Terrors — Обзоры хоррор-фильмов</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="site-header">
    <div class="brand">
        <span class="brand-name">Night Terrors</span>
    </div>
    <nav class="site-nav" aria-label="Main navigation">
        <a href="/home" data-link data-i18n="nav.home">Главная</a>
        <a href="/movies" data-link data-i18n="nav.movies">Фильмы</a>
        <a href="/reviews" data-link data-i18n="nav.reviews">Обзоры</a>
        <a href="/about" data-link data-i18n="nav.about">О сайте</a>
        <a href="/contact" data-link data-i18n="nav.contact">Контакты</a>
    </nav>
    <div class="controls">
        <button id="themeToggle" class="btn" aria-label="Переключить тему">
            🌓
        </button>
        <div class="lang-switch">
            <button class="btn" data-lang="ru">RU</button>
            <button class="btn" data-lang="en">EN</button>
        </div>
    </div>
</header>

<div class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb"></div>

<main id="app" class="content" role="main" tabindex="-1">

</main>

<footer class="site-footer" id="footer">

</footer>

<button id="scrollTop" class="scroll-top" aria-label="Наверх">↑</button>

<script src="/app.js"></script>

</body>
</html>
